<main id="main">
<section class="page-head">
  <div class="container">
    <nav class="crumbs" aria-label="Хлебные крошки"><a href="index.html">Главная</a><span>/</span><span aria-current="page">Магазин</span></nav>
    <h1 class="h1">Магазин</h1>
    <p class="muted">Цены и наличие — как на baltactics.ru. Товары «по запросу» уточняйте у менеджера.</p>
  </div>
</section>

<section class="section section--catalog">
  <div class="container">
    <div class="toolbar">
      <div class="chips chips--filter" role="tablist" id="catChips">
        <button class="chip is-on" data-cat="all" role="tab">Все <span class="chip__n"></span></button>
        <button class="chip" data-cat="vests" role="tab">Бронежилеты <span class="chip__n"></span></button>
        <button class="chip" data-cat="concealed" role="tab">Скрытое ношение <span class="chip__n"></span></button>
        <button class="chip" data-cat="insoles" role="tab">Стельки <span class="chip__n"></span></button>
        <button class="chip" data-cat="other" role="tab">Ткани и аксессуары <span class="chip__n"></span></button>
      </div>
      <label class="sort"><span class="sr-only">Сортировка</span>
        <select id="sortSel">
          <option value="pop">Сначала популярные</option>
          <option value="asc">Сначала дешевле</option>
          <option value="desc">Сначала дороже</option>
        </select>
      </label>
    </div>
    <div class="products" id="productGrid"></div>
    <div class="catalog-note">
      <div>
        <h3 class="h4">Нужна партия или нестандартная комплектация?</h3>
        <p class="muted">Опт, тендеры, OEM — подготовим коммерческое предложение и документы EAC.</p>
      </div>
      <a href="index.html#coop" class="btn btn--primary">Для бизнеса <svg class="i"><use href="#i-arrow"/></svg></a>
    </div>
  </div>
</section>
</main>
